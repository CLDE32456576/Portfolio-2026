<!DOCTYPE html>
<html>
<head>
    <title>Sales Workflow Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 30px; font-size: 2em; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #999;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }
        
        .form-section {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        
        .form-section h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        input, textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
        }
        
        button:hover { background: #5568d3; }
        
        .leads-section {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .leads-section h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover { background: #f9f9f9; }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-new { background: #e3f2fd; color: #1976d2; }
        .badge-contacted { background: #fff3e0; color: #f57c00; }
        .badge-replied { background: #f3e5f5; color: #7b1fa2; }
        .badge-customer { background: #e8f5e9; color: #388e3c; }
        
        .message-preview {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 0.9em;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 4px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Sales Workflow Agent</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <div class="value" id="stat-contacted">0</div>
            </div>
            <div class="stat-card">
                <h3>Replied</h3>
                <div class="value" id="stat-replied">0</div>
            </div>
            <div class="stat-card">
                <h3>Customers</h3>
                <div class="value" id="stat-customers">0</div>
            </div>
        </div>
        
        <div class="form-section">
            <h2>Add New Target</h2>
            <div class="form-grid">
                <input type="text" id="company_name" placeholder="Company Name" required>
                <input type="text" id="city" placeholder="City, State">
                <input type="text" id="owner_name" placeholder="Owner/Manager Name">
                <input type="email" id="email" placeholder="Email Address">
                <input type="tel" id="phone" placeholder="Phone Number">
            </div>
            <button onclick="processTarget()">Process Target</button>
            <div class="loading" id="loading">Processing...</div>
            <div id="result"></div>
        </div>
        
        <div class="leads-section">
            <h2>All Leads</h2>
            <table>
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Contact</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leads-table">
                    <tr><td colspan="5" style="text-align: center; color: #999;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // Load stats on page load
        window.onload = function() {
            loadStats();
            loadLeads();
            setInterval(loadStats, 5000);
            setInterval(loadLeads, 10000);
        };
        
        async function loadStats() {
            const response = await fetch('/api/stats');
            const stats = await response.json();
            
            document.getElementById('stat-total').textContent = stats.total_leads;
            document.getElementById('stat-contacted').textContent = stats.total_outreach;
            document.getElementById('stat-replied').textContent = stats.replied;
            document.getElementById('stat-customers').textContent = stats.customers;
        }
        
        async function loadLeads() {
            const response = await fetch('/api/leads');
            const data = await response.json();
            
            const tbody = document.getElementById('leads-table');
            tbody.innerHTML = '';
            
            if (data.leads.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">No leads yet</td></tr>';
                return;
            }
            
            data.leads.forEach(lead => {
                const badge = `<span class="badge badge-${lead.status}">${lead.status}</span>`;
                const row = `
                    <tr>
                        <td><strong>${lead.company_name}</strong></td>
                        <td>${lead.owner_name || '-'}</td>
                        <td><a href="mailto:${lead.email}">${lead.email || '-'}</a></td>
                        <td>${badge}</td>
                        <td>
                            <button onclick="viewLead(${lead.id})" style="padding: 4px 8px; font-size: 0.85em;">View</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        async function processTarget() {
            const company = document.getElementById('company_name').value;
            const city = document.getElementById('city').value;
            const owner = document.getElementById('owner_name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            
            if (!company || !email) {
                alert('Company name and email are required');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').innerHTML = '';
            
            try {
                const response = await fetch(
                    `/api/process?company_name=${encodeURIComponent(company)}&city=${encodeURIComponent(city)}&owner_name=${encodeURIComponent(owner)}&email=${encodeURIComponent(email)}&phone=${encodeURIComponent(phone)}`,
                    { method: 'POST' }
                );
                
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerHTML = `
                        <div class="success">
                            <strong>✅ Target processed!</strong><br>
                            Lead ID: ${result.lead_id}<br>
                            <strong>Message:</strong>
                            <div class="message-preview">${result.message}</div>
                            Status: ${result.status}
                        </div>
                    `;
                    
                    // Clear form
                    document.getElementById('company_name').value = '';
                    document.getElementById('city').value = '';
                    document.getElementById('owner_name').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('phone').value = '';
                    
                    // Reload leads
                    setTimeout(loadLeads, 1000);
                    loadStats();
                } else {
                    document.getElementById('result').innerHTML = `<div style="color: red;">❌ Error: ${result.detail}</div>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `<div style="color: red;">❌ Error: ${error.message}</div>`;
            }
            
            document.getElementById('loading').style.display = 'none';
        }
        
        async function viewLead(leadId) {
            alert('Lead details view coming soon. Lead ID: ' + leadId);
        }
    </script>
</body>
</html>
